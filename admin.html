<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Sign In — Miidear</title>
  <meta name="theme-color" content="#2F2F2F" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Ballet&family=Pinyon+Script&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin-body">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header is-scrolled" id="header">
    <a class="brand" href="index.html" aria-label="Miidear home"><span class="brand-name">Miidear</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="nav" id="nav" aria-label="Primary">
      <a href="portfolio.html">Portfolio</a>
      <a href="experience.html">The Experience</a>
      <a href="index.html#philosophy">About</a>
      <a href="contact.html">Contact</a>
      <a class="btn" href="booking.html">Begin Your Journey</a>
    </nav>
    <button class="nav-close" id="navClose" aria-label="Close menu"></button>
  </header>

  <main id="main" class="admin-main">
    <div class="container">
      <div class="gate">
        <div class="flourish"><span>&#9670;</span></div>
        <div class="script">Welcome</div>
        <p class="muted" style="margin-bottom:var(--s-4)">Sign in to manage the Miidear website.</p>
        <form id="gateForm" novalidate>
          <div class="field" style="text-align:left;margin-bottom:var(--s-3)">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" />
          </div>
          <div class="field" style="text-align:left;margin-bottom:var(--s-3)">
            <label for="pw">Password</label>
            <input id="pw" type="password" autocomplete="current-password" />
          </div>
          <button class="btn" type="submit" id="signInBtn" style="width:100%">Sign In</button>
          <p class="form-msg error" id="gateMsg" role="status" aria-live="polite"></p>
        </form>
        <p class="muted" style="font-size:0.78rem;margin-top:var(--s-4)"><a class="link-arrow" href="index.html">&larr; Return to site</a></p>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="main.js"></script>
  <script src="admin.js"></script>
</body>
</html>
